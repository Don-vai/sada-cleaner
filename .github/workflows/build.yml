name: Build SADA Cleaner APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Find the existing Android SDK manager
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK/cmdline-tools" ]; then
            echo "::error::Android SDK command-line tools directory not found: $SDK/cmdline-tools"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager executable not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "SDK path: $SDK"
          echo "SDK Manager: $SDKMANAGER"
          echo "SDKMANAGER_PATH=$SDKMANAGER" >> "$GITHUB_ENV"

      # 4. Accept licenses and install Android packages
      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_HOME"
          SDKMANAGER="$SDKMANAGER_PATH"

          # Automatically accept all Android SDK licenses.
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses \
            || {
              STATUS="${PIPESTATUS[1]:-1}"
              if [ "$STATUS" != "0" ]; then
                echo "::error::Android SDK license acceptance failed"
                exit 1
              fi
            }

          # Install each package by its exact SDK package ID.
          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          # Verify essential packages.
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"
          test -d "$SDK/ndk/27.2.12479018"

          echo "Android SDK packages installed successfully."

      # 5. Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 6. Rust toolchain
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # 7. Configure Rust Android linkers
      - name: Configure Rust Android linkers
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$TOOLCHAIN/armv7a-linux-androideabi24-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$TOOLCHAIN/x86_64-linux-android24-clang" >> "$GITHUB_ENV"

          test -x "$TOOLCHAIN/aarch64-linux-android24-clang"
          test -x "$TOOLCHAIN/armv7a-linux-androideabi24-clang"
          test -x "$TOOLCHAIN/x86_64-linux-android24-clang"

      # 8. Build Rust libraries
      - name: Build Rust libraries
        shell: bash
        run: |
          set -euo pipefail

          cargo build \
            --manifest-path native-rust/Cargo.toml \
            --release \
            --target aarch64-linux-android

          cargo build \
            --manifest-path native-rust/Cargo.toml \
            --release \
            --target armv7-linux-androideabi

          cargo build \
            --manifest-path native-rust/Cargo.toml \
            --release \
            --target x86_64-linux-android

      # 9. Copy Rust static libraries
      - name: Prepare Rust libraries
        shell: bash
        run: |
          set -euo pipefail

          BASE="app/src/main/cpp/libs"

          mkdir -p "$BASE/arm64-v8a"
          mkdir -p "$BASE/armeabi-v7a"
          mkdir -p "$BASE/x86_64"

          cp native-rust/target/aarch64-linux-android/release/libsada_cleaner_native.a \
            "$BASE/arm64-v8a/"

          cp native-rust/target/armv7-linux-androideabi/release/libsada_cleaner_native.a \
            "$BASE/armeabi-v7a/"

          cp native-rust/target/x86_64-linux-android/release/libsada_cleaner_native.a \
            "$BASE/x86_64/"

      # 10. Configure CMake and link Rust
      - name: Configure native CMake
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22.1)

          project(sada_cleaner LANGUAGES C CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          add_library(
              sada_native
              SHARED
              native_engine.cpp
              rust_bridge.cpp
          )

          if(ANDROID_ABI STREQUAL "arm64-v8a")
              set(RUST_ABI "arm64-v8a")
          elseif(ANDROID_ABI STREQUAL "armeabi-v7a")
              set(RUST_ABI "armeabi-v7a")
          elseif(ANDROID_ABI STREQUAL "x86_64")
              set(RUST_ABI "x86_64")
          else()
              message(FATAL_ERROR "Unsupported ABI: ${ANDROID_ABI}")
          endif()

          set(
              RUST_LIBRARY
              "${CMAKE_CURRENT_SOURCE_DIR}/libs/${RUST_ABI}/libsada_cleaner_native.a"
          )

          if(NOT EXISTS "${RUST_LIBRARY}")
              message(FATAL_ERROR "Rust library missing: ${RUST_LIBRARY}")
          endif()

          add_library(sada_rust STATIC IMPORTED)

          set_target_properties(
              sada_rust
              PROPERTIES
              IMPORTED_LOCATION "${RUST_LIBRARY}"
          )

          find_library(log-lib log)

          target_link_libraries(
              sada_native
              PRIVATE
              sada_rust
              ${log-lib}
              android
              dl
              m
          )
          EOF

      # 11. Build debug APK
      - name: Build debug APK
        run: gradle assembleDebug

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sada-cleaner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
